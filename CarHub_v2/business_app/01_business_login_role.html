<script>
        // Micro-interaction for radio buttons to update checkmark visibility manually if needed, 
        // though CSS handles it gracefully. Adding focus styles for accessibility.
        const radioInputs = document.querySelectorAll('input[type="radio"]');
        radioInputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.nextElementSibling.classList.add('ring-2', 'ring-primary', 'ring-offset-2');
            });
            input.addEventListener('blur', () => {
                input.nextElementSibling.classList.remove('ring-2', 'ring-primary', 'ring-offset-2');
            });
        });
    </script>
