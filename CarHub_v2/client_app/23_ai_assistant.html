<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>المساعد الذكي</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#005228",

                        "on-tertiary-container": "#2d3746",
                        "inverse-primary": "#4de085",
                        "surface-tint": "#006d37",
                        "surface-variant": "#e0e3e6",
                        "outline-variant": "#bccabb",

                        "primary-fixed": "#6dfe9e",
                        "on-primary-fixed": "#00210d",
                        "tertiary-fixed": "#d9e3f7",
                        "surface-bright": "#f7f9fc",
                        "on-background": "#191c1e",
                        "secondary-fixed-dim": "#b9c7e4",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e0e3e6",
                        "primary-fixed-dim": "#4de085",
                        "surface-dim": "#d8dadd",
                        "surface-container-high": "#e6e8eb",
                        "on-secondary-fixed": "#0d1c32",
                        "surface-container-low": "#f2f4f7",
                        "tertiary-container": "#96a0b2",
                        "error-container": "#ffdad6",
                        "background": "#f7f9fc",
                        "surface-container": "#eceef1",
                        "on-secondary-fixed-variant": "#39475f",
                        "surface": "#f7f9fc",
                        "on-tertiary-fixed-variant": "#3d4757",
                        "on-surface-variant": "#3d4a3e",

                    "borderRadius": {

                    "spacing": {

                        "section-margin": "32px",
                        "container-padding": "20px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "card-gap": "16px"
                    },
                    "fontFamily": {

                }
            }
        }

<style>
        body {
            font-family: 'Readex Pro', sans-serif;
            background-color: #F5F7FA; /* Level 0 Floor */
        }
        
        .chat-container {
            height: calc(100vh - 64px - 80px); /* Adjust based on header and input height */
            overflow-y: auto;
        }

        .gradient-btn {
            background: linear-gradient(90deg, #00B761 0%, #009951 100%);
        }

        .gradient-header {
            background: linear-gradient(135deg, #0A192F 0%, #112240 100%);
        }

        /* Hide scrollbar for horizontal scroll but allow scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background bg-background h-screen flex flex-col relative md:hidden">
<!-- Header (Custom intent: Deep navy header for chat) -->
<header class="gradient-header w-full h-16 flex items-center justify-between px-container-padding sticky top-0 z-50 shadow-md">
<div class="flex items-center gap-3">
<button class="text-on-primary hover:bg-white/10 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary-container">smart_toy</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary tracking-tight">المساعد الذكي</h1>
</div>
</div>
<button class="text-on-primary hover:bg-white/10 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto chat-container p-container-padding flex flex-col gap-6 pb-24">
<!-- Date divider -->
<div class="flex justify-center my-2">
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full">اليوم</span>
</div>
<!-- User Bubble -->
<div class="flex flex-row-reverse items-end gap-2 mb-2">
<img alt="User" class="w-8 h-8 rounded-full object-cover shadow-sm border border-outline-variant" data-alt="A small circular avatar profile picture of a male user in a modern automotive app context. The background of the avatar is a subtle light grey, contrasting with a dark navy border. The mood is professional and clean, matching a high-end service aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-wr3UCHEMkwgqbl3PknskxP-gsiAObX8fq13wGwItuH-f6dll7BpnIo2bJkhMMHIb4Xmop8MnIw7tHCmddZWuBNB7g0TF7QXcdTnSrvc7fciMK_0xrU0w9ePrZ2bEPWZrj9IXk654iClXOgbvG83sDprkLpUV9GWrH1QMfxKV8YH_AhMdTt-DcNniZZKKSXYHw7eEQLLD97SAGTfQkPot_54rzCT35JWMkIKWxDSuDg1sDzSw5kBk"/>
<div class="bg-primary-container text-on-primary-container p-4 rounded-xl rounded-bl-none shadow-sm max-w-[85%]">
<p class="font-body-md text-body-md">عندي صوت بالفرامل وبدي أرش المصد</p>
</div>
</div>
<!-- AI Bubble -->
<div class="flex items-start gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center shrink-0 shadow-sm mt-1">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div class="flex flex-col gap-3 w-full">
<!-- Text response -->
<div class="bg-surface-container-lowest text-on-surface p-4 rounded-xl rounded-br-none shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-variant">
<p class="font-body-md text-body-md">فهمت عليك. بناءً على وصفك، أقترح عليك الإجراءات التالية:</p>
</div>
<!-- Smart Action Cards (Carousel) -->
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2 pt-1 w-full pl-4 -mr-2 pr-2">
<!-- Card 1 -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-variant min-w-[240px] flex flex-col p-4 shrink-0 hover:-translate-y-1 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-3 text-primary-container">
<span class="material-symbols-outlined text-[24px]">shopping_cart</span>
</div>
<h3 class="font-label-bold text-label-bold text-on-surface mb-4">عرض فحمات الفرامل المتوافقة</h3>
<button class="mt-auto gradient-btn text-on-primary font-label-bold text-label-bold py-2 px-4 rounded-full w-full shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
                            تسوق الآن
                            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
</button>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-variant min-w-[240px] flex flex-col p-4 shrink-0 hover:-translate-y-1 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-error-container/30 flex items-center justify-center mb-3 text-primary-container">
<span class="material-symbols-outlined text-[24px]">gavel</span>
</div>
<h3 class="font-label-bold text-label-bold text-on-surface mb-4">فتح مناقصة فورية لأعمال الدهان</h3>
<button class="mt-auto bg-surface-container-high text-on-surface font-label-bold text-label-bold py-2 px-4 rounded-full w-full border border-outline-variant hover:bg-surface-variant active:scale-95 transition-transform flex items-center justify-center gap-2">
                            اطلب عروض أسعار
                            <span class="material-symbols-outlined text-[16px]">add_circle</span>
</button>
</div>
</div>
</div>
</div>
</main>
<!-- Message Input (Bottom anchored) -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant shadow-[0_-4px_20px_rgba(10,25,47,0.05)] p-4 z-40">
<div class="flex items-center gap-3">
<button class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors shrink-0">
<span class="material-symbols-outlined">add</span>
</button>
<div class="flex-1 bg-surface-container-low rounded-full px-4 py-3 flex items-center border border-surface-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="bg-transparent w-full border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 p-0 outline-none" placeholder="اكتب رسالتك هنا..." type="text"/>
<button class="text-on-surface-variant hover:text-primary-container ml-2">
<span class="material-symbols-outlined">mic</span>
</button>
</div>
<button class="w-12 h-12 rounded-full gradient-btn flex items-center justify-center text-on-primary shadow-md active:scale-95 transition-transform shrink-0">
<span class="material-symbols-outlined rtl:rotate-180">send</span>
</button>
</div>
</div>
</body></html>
