<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- High-Contrast Hero Background Canopy -->
<div class="absolute top-0 left-0 right-0 h-[397px] bg-inverse-surface rounded-b-[40px] z-0 overflow-hidden shadow-lg">
<div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIj48L3JlY3Q+CjxwYXRoIGQ9Ik0wIDBMOCA4Wk04IDBMMCA4WiIgc3Ryb2tlPSIjMDAwIiBzdHJva2Utd2lkdGg9IjEiPjwvcGF0aD4KPC9zdmc+')]"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 px-container-padding py-section-margin w-full max-w-7xl mx-auto min-h-screen">
<!-- Branding Header -->
<header class="text-center mb-stack-lg">
<h1 class="font-headline-xl text-headline-xl text-primary-fixed tracking-tight flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">directions_car</span>
                CarHub
            </h1>
<p class="font-body-lg text-body-lg text-inverse-on-surface mt-2 opacity-90">سوق قطع الغيار والمزادات الأسرع نمواً</p>
</header>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl w-full max-w-md shadow-[0px_4px_20px_rgba(10,25,47,0.1)] p-8 border border-surface-variant relative overflow-hidden">
<!-- Subtle accent graphic -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-5 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
<div class="text-center mb-section-margin">
<h2 class="font-headline-lg text-headline-lg text-on-surface">مرحباً بك مجدداً</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">قم بتسجيل الدخول للمتابعة إلى حسابك</p>
</div>
<form class="space-y-stack-md relative z-10" onsubmit="event.preventDefault();">
<!-- Phone/Email Input -->
<div class="relative group">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="w-full bg-surface shadow-sm border border-outline-variant rounded-lg py-3 pr-12 pl-4 font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="username" name="username" placeholder="رقم الجوال أو البريد الإلكتروني" type="text"/>
</div>
<!-- Password Input -->
<div class="relative group">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full bg-surface shadow-sm border border-outline-variant rounded-lg py-3 pr-12 pl-4 font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" name="password" placeholder="كلمة المرور" type="password"/>
<button class="absolute inset-y-0 left-0 pl-4 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-start pt-1">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Primary Action -->
<div class="pt-stack-sm">
<button class="w-full bg-primary-container text-on-primary-fixed font-label-bold text-label-bold rounded-full py-4 shadow-md hover:shadow-lg hover:bg-[#00a356] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        تسجيل الدخول
                        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="mt-section-margin relative flex items-center py-4">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">ليس لديك حساب؟</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Ghost Link -->
<div class="mt-4 text-center">
<a class="inline-flex items-center justify-center font-label-bold text-label-bold text-primary hover:text-primary-fixed-dim bg-transparent border border-outline-variant hover:border-primary hover:bg-surface-container rounded-full px-6 py-3 w-full transition-all duration-200" href="#">
                    إنشاء حساب جديد
                </a>
</div>
</div>
<!-- Footer snippet -->
<div class="mt-12 text-center relative z-10">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                بتسجيل الدخول، أنت توافق على <a class="text-secondary hover:underline" href="#">الشروط والأحكام</a> و <a class="text-secondary hover:underline" href="#">سياسة الخصوصية</a>
</p>
</div>
