<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);

            font-family: 'Readex Pro', sans-serif;

<body class="bg-surface text-on-surface min-h-screen flex flex-col pb-24 md:pb-8">
<!-- TopAppBar -->
<header class="bg-surface-container dark:bg-surface-container-highest text-primary dark:text-primary-fixed w-full top-0 sticky bg-gradient-to-r from-on-secondary-fixed to-on-primary-fixed-variant shadow-md flex flex-row-reverse justify-between items-center px-container-padding py-4 w-full z-40">
<div class="flex items-center gap-4 cursor-pointer active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a Middle Eastern male mechanic wearing a clean, modern uniform. The lighting is bright and even, casting soft shadows, suitable for a high-end corporate application profile picture. The background is a plain, neutral light gray to emphasize the subject." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvYBgBC-3fYpQ-lsvbD2ReJ54g2F5RixA-WkfKsqZzQ1JEqtgrCkKN_4vJsaKGbm2x6gWoXCm3j72HKAYpeMeiinuhxIqIbt7MMR-qC9V862iCOykNvrStR6DiXraA2ebPEe3LmVHyRSCcj7skPLMNIFhAP91-4LvdlwYNoPMIHKzzkibr5UrifCztCw4GirwlzqnpRqtIqp2FFSiWGNN_E0CcH3p6Rbf8mT8FlVLPFKjzVlRd8P_5">
</div>
<span class="text-headline-md font-headline-md text-on-primary">CarHub</span>
</div>
<div class="flex items-center cursor-pointer active:scale-95 transition-transform hover:opacity-80 transition-opacity text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto px-container-padding py-stack-lg">
<div class="mb-section-margin">
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-stack-sm">إنشاء مناقصة جديدة</h1>
<p class="text-body-md font-body-md text-on-surface-variant">الرجاء إدخال تفاصيل العطل أو المشكلة للحصول على عروض أسعار من الورش المعتمدة.</p>
</div>
<form class="space-y-stack-lg">
<!-- Title -->
<div class="bg-surface-container-lowest rounded-[16px] p-stack-md shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-container-high transition-shadow hover:shadow-[0px_8px_30px_rgba(10,25,47,0.08)]">
<label class="block text-label-bold font-label-bold text-on-surface mb-stack-sm" for="tender-title">عنوان المناقصة</label>
<input class="w-full bg-surface border border-outline-variant rounded-[8px] px-4 py-3 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="tender-title" placeholder="مثال: إصلاح خدوش الباب" type="text">
</div>
<!-- Category & City (Bento Style Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-lg">
<div class="bg-surface-container-lowest rounded-[16px] p-stack-md shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-container-high">
<label class="block text-label-bold font-label-bold text-on-surface mb-stack-sm" for="tender-category">الفئة</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-[8px] px-4 py-3 text-body-md font-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="tender-category">
<option disabled="" selected="" value="">اختر الفئة...</option>
<option value="mechanic">ميكانيك</option>
<option value="electric">كهرباء</option>
<option value="paint">دهان وسمكرة</option>
</select>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="bg-surface-container-lowest rounded-[16px] p-stack-md shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-container-high">
<label class="block text-label-bold font-label-bold text-on-surface mb-stack-sm" for="tender-city">المدينة</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-[8px] px-4 py-3 text-body-md font-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="tender-city">
<option disabled="" selected="" value="">اختر المدينة...</option>
<option value="riyadh">الرياض</option>
<option value="jeddah">جدة</option>
<option value="dammam">الدمام</option>
</select>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Description -->
<div class="bg-surface-container-lowest rounded-[16px] p-stack-md shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-container-high">
<label class="block text-label-bold font-label-bold text-on-surface mb-stack-sm" for="tender-description">وصف المشكلة</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-[8px] px-4 py-3 text-body-md font-body-md text-on-surface resize-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="tender-description" placeholder="يرجى وصف المشكلة بالتفصيل لمساعدة الورش في تقديم عروض دقيقة..." rows="4"></textarea>
</div>
<!-- Photo Upload -->
<div class="bg-surface-container-lowest rounded-[16px] p-stack-md shadow-[0px_4px_20px_rgba(10,25,47,0.05)] border border-surface-container-high">
<label class="block text-label-bold font-label-bold text-on-surface mb-stack-sm">رفع صور الضرر/الحادث</label>
<div class="border-2 border-dashed border-outline-variant rounded-[8px] p-8 flex flex-col items-center justify-center bg-surface hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
<p class="text-body-md font-body-md text-on-surface-variant text-center mb-2">اضغط هنا أو اسحب الصور للإفلات</p>
<p class="text-label-sm font-label-sm text-tertiary text-center">JPG, PNG بحد أقصى 5 ميجابايت للصورة</p>
</div>
</div>
<!-- CTA -->
<div class="pt-stack-md">
<button class="w-full bg-gradient-to-r from-primary-container to-[#009b52] hover:opacity-90 text-on-primary font-headline-md text-headline-md rounded-full py-4 shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span>نشر المناقصة</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">publish</span>
</button>
</div>
</form>
</main>
</body></html>
