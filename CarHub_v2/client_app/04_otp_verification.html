<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-container-padding relative overflow-hidden">
<!-- Ambient Background Elements -->
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-secondary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
<main class="w-full max-w-md relative z-10">
<!-- Main Card -->
<div class="glass-card rounded-[16px] shadow-[0px_4px_20px_rgba(10,25,47,0.05)] p-8 flex flex-col items-center text-center">
<!-- Brand Logo/Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="shield_lock">shield_lock</span>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">التحقق من الرمز</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">لقد أرسلنا رمز التحقق إلى رقم هاتفك المحمول. الرجاء إدخاله أدناه.</p>
<!-- OTP Input Fields -->
<form class="w-full flex flex-col gap-stack-lg" id="otp-form">
<div class="flex justify-center gap-card-gap w-full" dir="ltr">
<input autocomplete="off" autofocus="" class="w-14 h-16 text-center font-headline-xl text-headline-xl text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg otp-input transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container" maxlength="1" type="text"/>
<input autocomplete="off" class="w-14 h-16 text-center font-headline-xl text-headline-xl text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg otp-input transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container" maxlength="1" type="text"/>
<input autocomplete="off" class="w-14 h-16 text-center font-headline-xl text-headline-xl text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg otp-input transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container" maxlength="1" type="text"/>
<input autocomplete="off" class="w-14 h-16 text-center font-headline-xl text-headline-xl text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg otp-input transition-all focus:border-primary-container focus:ring-1 focus:ring-primary-container" maxlength="1" type="text"/>
</div>
<div class="flex flex-col items-center gap-stack-sm mt-4">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-bold text-label-bold py-3 px-6 rounded-full shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 active:scale-95 flex justify-center items-center gap-2" type="button">

<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="mt-4 flex items-center justify-center gap-2">
<span class="font-body-sm text-body-sm text-on-surface-variant">لم تستلم الرمز؟</span>
<button class="font-label-bold text-label-bold text-primary hover:text-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="resend-btn" type="button">
                            إعادة إرسال الرمز خلال <span id="timer">00:59</span>
</button>
</div>

</main>
<script>
        // Simple OTP input navigation
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                }
            });
            
            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                 if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Timer logic
        let timeLeft = 59;
        const timerDisplay = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
            timerDisplay.textContent = '00:' + seconds;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                resendBtn.disabled = false;
                resendBtn.innerHTML = 'إعادة إرسال الرمز الآن';
            }
        }, 1000);
    </script>
