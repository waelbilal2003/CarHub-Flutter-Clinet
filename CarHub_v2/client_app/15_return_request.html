<body class="bg-background text-on-background min-h-screen pb-24 md:pb-8 relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm z-40">
<div class="flex flex-row-reverse items-center justify-between px-container-padding py-stack-sm w-full">
<div class="flex items-center gap-2">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-150 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_forward" data-weight="regular">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim">طلب إرجاع منتج</h1>
</div>
<div class="text-primary dark:text-primary-fixed-dim font-headline-lg-mobile text-headline-lg-mobile font-bold">CarHub</div>
</div>
</header>
<!-- Main Content -->
<main class="px-container-padding pt-stack-md max-w-3xl mx-auto flex flex-col gap-section-margin">
<!-- Product Summary Card -->
<section class="bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_20px_rgba(10,25,47,0.05)] p-stack-md flex gap-stack-md items-center border border-surface-variant">
<div class="w-24 h-24 rounded-lg overflow-hidden shrink-0 bg-surface-container flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A high-quality studio photograph of a premium automotive brake pad set resting on a clean, light grey surface. The lighting is soft and even, highlighting the mechanical texture of the friction material and the metallic finish of the backing plate. The setting is a minimalist, modern workspace, emphasizing precision and quality within an automotive parts context. The color palette features neutral greys and subtle metallic tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlLMH8XnUk5_Knapey0bSdgMM2eOkBVLSdSAMlPrtHCRyZth243BhAXW6wjAuQroQXjPfUhax2SVrLK4p0T53tlw9blHVy5ziqL1rb-INTpw09RN2FFjtSHTYPZW6FDRLOl-bPrzsGCatw9BpjIRmHSGRP8CKh8q1HhHbAiR8ZL-rknLUEn8Cbqmw3KepiIruAtazJaUodqxH6XCUMSgqUHD6weJZpuouQJif7ne6E8FhKiSP3VT55"/>
</div>
<div class="flex-1 flex flex-col gap-1">
<div class="flex justify-between items-start">
<h2 class="font-body-lg text-body-lg text-on-surface font-semibold">طقم تيل فرامل أمامي سيراميك</h2>
<span class="font-label-bold text-label-bold text-on-surface-variant">كمية: 1</span>
</div>
<p class="font-body-sm text-body-sm text-tertiary">رقم القطعة: CH-BP-2024</p>
<p class="font-headline-md text-headline-md text-primary mt-1">450 ر.س</p>
</div>
</section>
<!-- Return Form -->
<form class="flex flex-col gap-stack-lg bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_20px_rgba(10,25,47,0.05)] p-stack-md border border-surface-variant">
<!-- Reason for Return -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="return_reason">سبب الإرجاع</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors cursor-pointer pr-10" id="return_reason" name="return_reason">
<option disabled="" selected="" value="">اختر سبب الإرجاع</option>
<option value="wrong_item">قطعة خاطئة (غير مطابقة للطلب)</option>
<option value="damaged">القطعة تالفة أو معيبة</option>
<option value="not_needed">لم تعد هناك حاجة للقطعة</option>
<option value="wrong_fitment">القطعة لا تتناسب مع سيارتي</option>
<option value="other">سبب آخر</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Item Condition -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface">حالة المنتج</label>
<div class="flex gap-stack-md">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface" name="item_condition" type="radio" value="unopened"/>
<span class="font-body-md text-body-md text-on-surface-variant">العبوة مغلقة (لم تفتح)</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface" name="item_condition" type="radio" value="opened"/>
<span class="font-body-md text-body-md text-on-surface-variant">العبوة مفتوحة</span>
</label>
</div>
</div>
<!-- Additional Notes -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="additional_notes">ملاحظات إضافية (اختياري)</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="additional_notes" name="additional_notes" placeholder="يرجى كتابة أي تفاصيل إضافية قد تساعدنا في معالجة طلبك..." rows="4"></textarea>
</div>
<!-- Warning/Info Banner -->
<div class="bg-surface-container-low p-stack-sm rounded-lg flex gap-3 items-start border border-surface-variant">
<span class="material-symbols-outlined text-tertiary mt-0.5" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                    سيتم مراجعة طلب الإرجاع الخاص بك خلال 24-48 ساعة عمل. يرجى التأكد من إرجاع المنتج في حالته الأصلية مع جميع الملحقات والتغليف الأصلي لتجنب أي خصومات.
                </p>
</div>
<!-- Submit Action -->
<button class="mt-4 w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-4 rounded-full shadow-md hover:bg-surface-tint hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 bg-gradient-to-l from-primary-container to-[#008c4a]" type="button">
<span>إرسال طلب الإرجاع</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</form>
</main>
<!-- Floating AI Assistant Button (Contextually relevant for helping with returns) -->
<button class="fixed bottom-24 md:bottom-8 left-4 w-14 h-14 bg-surface-container-lowest border border-outline-variant rounded-full shadow-lg flex items-center justify-center hover:bg-surface-container-high transition-colors z-50 text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="smart_toy">smart_toy</span>
</button>
</body></html>
